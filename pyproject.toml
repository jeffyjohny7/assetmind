[project]
name = "assetmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jeffyjohny7", email = "jeffyjohny07@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.34.0",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
assetmind = "assetmind:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
